services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: workstation-smoke-only
    ports:
      - '127.0.0.1::5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 45
  cache:
    image: docker.io/valkey/valkey:8-alpine
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  pgdata:
